name = "naiyo-syoumei-app"
main = "src/index.js"
compatibility_date = "2026-08-01"

# ANTHROPIC_API_KEY / STRIPE_SECRET_KEY はコミットせず、下記コマンドでシークレット登録する。
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put STRIPE_SECRET_KEY
# ローカル開発では .dev.vars に書く（.gitignore済み）。

[vars]
# 機密でない設定値のみここに置く（例: 許可オリジン）。
# Stripe Checkoutのsuccess_url/cancel_urlのオープンリダイレクト対策にも使う。
# workers.devのデフォルトURLは現在の本番稼働先のため含めている。
# mobile.qulofune-office.jp はカスタムドメイン設定後に有効になる想定（現状は未設定）。
ALLOWED_ORIGINS = "https://planfit.qulofune2020.workers.dev,https://naiyo-syoumei.com,https://mobile.qulofune-office.jp"

# public/ 配下の静的ファイル（入力フォーム等）を配信する。
# マッチする静的アセットがあればWorkerコードより先に配信され、
# マッチしないパス（/api/*等）だけがsrc/index.jsのfetch()に渡る。
[assets]
directory = "./public"
