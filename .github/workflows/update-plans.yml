name: 毎月プランデータ自動更新

on:
  schedule:
    # 毎月1日 午前9時（日本時間）に自動実行
    - cron: '0 0 1 * *'
  # 手動実行ボタンも追加
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Googleシートからプランデータを取得してindex.htmlを更新
        env:
          SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SHEET_API_KEY: ${{ secrets.GOOGLE_SHEET_API_KEY }}
        run: node update-plans.js

      - name: 変更をコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add index.html plans_data.json
          git diff --staged --quiet || git commit -m "🔄 プランデータ自動更新 $(date '+%Y年%m月%d日')"
          git push
